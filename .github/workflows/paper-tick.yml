name: paper-tick

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py once
